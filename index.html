<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>TileRush</title>
    <link rel="icon" type="image/png" sizes="512x512" href="StreamingAssets/TileRushPromo/tilerush-icon.png?v=74f58368">
    <link rel="apple-touch-icon" href="StreamingAssets/TileRushPromo/tilerush-icon.png?v=74f58368">
    <link rel="stylesheet" href="TemplateData/style.css?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611-surfx4-splash1">
    <link rel="manifest" href="manifest.webmanifest?v=74f58368">
  </head>
  <body>
    <div id="unity-container">
      <div id="surfx-scene" aria-hidden="true">
        <div class="surfx-wave surfx-wave-back"></div>
        <div class="surfx-wave surfx-wave-front"></div>
        <img class="surfx-surfer" src="StreamingAssets/TileRushPromo/surfx-surfer.svg" alt="">
        <a class="surfx-logo" href="https://www.surfx-protocol.com" target="_blank" rel="noopener noreferrer" aria-label="SurfX website" aria-disabled="true" tabindex="-1">
          <svg viewBox="0 0 54 40" aria-hidden="true" focusable="false"><path d="M3 25c9 0 9-16 17-16s8 17 15 17c5 0 7-7 16-7M3 34c9 0 10-7 17-7 8 0 8 7 16 7 7 0 9-6 15-6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Surf<span class="surfx-x">X</span></span>
        </a>
      </div>
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="600" height="760" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <img id="tilerush-loading-logo" src="StreamingAssets/TileRushPromo/logo.png?v=splash1" alt="TileRush logo">
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.tileRushSetSurfXVisible = function (visible) {
        var loading = document.getElementById("unity-loading-container");
        if (loading) loading.style.display = "none";
        var scene = document.getElementById("surfx-scene");
        if (!scene) return;
        scene.classList.toggle("is-visible", !!visible);
        scene.setAttribute("aria-hidden", visible ? "false" : "true");
        var logo = scene.querySelector(".surfx-logo");
        if (logo) {
          logo.tabIndex = visible ? 0 : -1;
          logo.setAttribute("aria-disabled", visible ? "false" : "true");
        }
      };

      document.querySelector(".surfx-logo").addEventListener("click", function (event) {
        if (!document.getElementById("surfx-scene").classList.contains("is-visible"))
          event.preventDefault();
      });

      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611-surfx4-splash1");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "webgl";
      var loaderUrl = buildUrl + "/WebGLRelease.loader.js?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLRelease.data.unityweb?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611",
        frameworkUrl: buildUrl + "/WebGLRelease.framework.js.unityweb?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611",
        codeUrl: buildUrl + "/WebGLRelease.wasm.unityweb?v=f9a6b338ff2f3cd7b474f583069ed6a26fc5f72611",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "TileRush",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (loadingContainer.style.display !== "none") {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          }
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
